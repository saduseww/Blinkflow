<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blink Blossom Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF0F5; --card:#FFFFFF; --ink:#4A2340; --soft:#8E6A82; --line:#F6D3E1;
  --pink:#EE6C9C; --pink-d:#D4528A; --pink-l:#FFD9E7;
  --mint:#C5EEDC; --mint-ink:#1F6B4E;
  --butter:#FFF0B3; --butter-ink:#7A5B00;
  --sky:#D3E8FB; --sky-ink:#1F5C93;
  --rose:#FFD3D3; --rose-ink:#9B2C3A;
  --shadow:0 6px 18px rgba(212,82,138,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#2A1626; --card:#3A2236; --ink:#FFE9F1; --soft:#C9A3B8; --line:#55324D;
    --pink:#F27FAA; --pink-d:#FF9CC0; --pink-l:#5A2A47;
    --mint:#21493A; --mint-ink:#BFF0DB;
    --butter:#52440F; --butter-ink:#FFE88A;
    --sky:#1E3F5E; --sky-ink:#C5E2FF;
    --rose:#5A2630; --rose-ink:#FFC4C9;
    --shadow:0 6px 18px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',ui-rounded,system-ui,sans-serif;font-size:15px;line-height:1.4;min-height:100vh;padding-bottom:96px}
h1,h2,h3{font-family:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif;margin:0;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* header */
header{padding:22px 0 8px;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;background:var(--pink-l);display:grid;place-items:center;flex:none}
header h1{font-size:25px;line-height:1.1;color:var(--pink-d)}
header p{margin:0;color:var(--soft);font-size:13px}
.sync{font-size:12px;font-weight:700;margin-left:4px}
.gear{margin-left:auto;border:0;background:var(--card);width:40px;height:40px;border-radius:50%;box-shadow:var(--shadow);font-size:18px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{border-radius:20px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:21px;font-weight:600}
.stat span{font-size:12px}
.s1{background:var(--butter);color:var(--butter-ink)}
.s2{background:var(--sky);color:var(--sky-ink)}
.s3{background:var(--rose);color:var(--rose-ink)}

/* search / filters */
.search{width:100%;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:12px 18px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;color:var(--soft)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}

/* order cards */
.list{display:grid;gap:12px;margin-top:6px}
.order{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);border:2px solid transparent}
.order:active{border-color:var(--pink-l)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.order h3{font-size:18px}
.muted{color:var(--soft);font-size:13px}
.price{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:600;color:var(--pink-d);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700}
.t-pending{background:var(--butter);color:var(--butter-ink)}
.t-packed{background:var(--sky);color:var(--sky-ink)}
.t-out{background:var(--pink-l);color:var(--pink-d)}
.t-done{background:var(--mint);color:var(--mint-ink)}
.t-cancel{background:var(--rose);color:var(--rose-ink)}
.t-paid{background:var(--mint);color:var(--mint-ink)}
.t-unpaid{background:var(--rose);color:var(--rose-ink)}
.t-method{background:var(--bg);color:var(--soft);border:1.5px solid var(--line)}
.items{margin:0;padding:0;list-style:none;font-size:13.5px}
.items li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--pink);color:#fff}
.btn.ghost{background:var(--pink-l);color:var(--pink-d)}
.btn.danger{background:var(--rose);color:var(--rose-ink)}
.btn.sm{padding:7px 14px;font-size:13px}
.empty{text-align:center;padding:40px 20px;color:var(--soft)}
.empty .big{font-size:48px}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border:0;background:var(--pink);color:#fff;height:58px;padding:0 24px;border-radius:999px;font-family:'Fredoka',sans-serif;font-size:17px;font-weight:500;box-shadow:0 10px 24px rgba(212,82,138,.4);display:flex;align-items:center;gap:8px;z-index:5}

/* sheet / form */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;display:none}
.sheet.open{display:block}
.sheet .bar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;z-index:2;max-width:640px;margin:0 auto}
.sheet .bar h2{font-size:22px;color:var(--pink-d)}
.x{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;font-size:18px;box-shadow:var(--shadow)}
form{max-width:640px;margin:0 auto;padding:0 16px 120px;display:grid;gap:14px}
.box{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px}
.box h3{font-size:17px}
label{display:grid;gap:4px;font-weight:700;font-size:13px;color:var(--soft)}
input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;font-weight:600}
textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 6px;font-weight:700;color:var(--soft)}
.seg button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.seg.g button.on.girl{background:#F58FB4;border-color:#F58FB4}
.seg.g button.on.boy{background:#6FB4EB;border-color:#6FB4EB}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sizes button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 11px;font-weight:700;font-size:13px;color:var(--soft)}
.sizes button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{border:2px dashed var(--line);border-radius:18px;padding:12px;display:grid;gap:10px}
.item .top{display:flex;justify-content:space-between;align-items:center}
.item .top b{font-family:'Fredoka',sans-serif;font-weight:500}
.rm{border:0;background:var(--rose);color:var(--rose-ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px}
.add-item{border:2px dashed var(--pink);background:transparent;color:var(--pink-d);border-radius:18px;padding:12px;font-weight:700}
.sum{display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600;color:var(--pink-d);border-top:2px dashed var(--line);padding-top:8px;margin-top:4px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:24px 16px calc(14px + env(safe-area-inset-bottom));z-index:3}
.savebar .btn{display:block;width:100%;max-width:608px;margin:0 auto;padding:15px;font-size:17px;font-family:'Fredoka',sans-serif;font-weight:500}
.err{color:var(--rose-ink);background:var(--rose);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;display:none}

/* dialogs */
.modal{position:fixed;inset:0;background:rgba(74,35,64,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.dialog{background:var(--card);border-radius:26px;padding:22px;max-width:340px;width:100%;display:grid;gap:12px}
.dialog h3{font-size:20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 32 32"><g fill="#EE6C9C"><circle cx="16" cy="7" r="5.5"/><circle cx="25" cy="14" r="5.5"/><circle cx="21.5" cy="24.5" r="5.5"/><circle cx="10.5" cy="24.5" r="5.5"/><circle cx="7" cy="14" r="5.5"/></g><circle cx="16" cy="16.5" r="4.5" fill="#FFD84D"/></svg>
    </div>
    <div>
      <h1>Blink Blossom</h1>
      <p>Kids clothing orders <span id="sync" class="sync"></span></p>
    </div>
    <button class="gear" id="gearBtn" aria-label="Settings">⚙️</button>
  </header>

  <div class="stats">
    <div class="stat s1"><b id="stTodo">0</b><span>To deliver</span></div>
    <div class="stat s2"><b id="stDone">0</b><span>Delivered</span></div>
    <div class="stat s3"><b id="stUnpaid">0</b><span>Unpaid</span></div>
  </div>

  <input class="search" id="search" type="search" placeholder="Search name, phone or address" aria-label="Search orders">
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
</div>

<button class="fab" id="fab"><span style="font-size:22px;line-height:1">＋</span> New order</button>

<!-- Order form -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
  <div class="bar">
    <h2 id="formTitle">New order</h2>
    <button class="x" id="closeForm" aria-label="Close">✕</button>
  </div>
  <form id="form" autocomplete="off" novalidate>
    <div class="box">
      <h3>Customer</h3>
      <label>Name<input type="text" id="fName" placeholder="e.g. Nimali Perera"></label>
      <label>Phone<input type="tel" id="fPhone" placeholder="Phone number"></label>
      <label>Delivery address<textarea id="fAddress" placeholder="House, street, city"></textarea></label>
    </div>

    <div class="box">
      <h3>Items</h3>
      <div id="itemsBox" style="display:grid;gap:10px"></div>
      <button type="button" class="add-item" id="addItem">＋ Add another item</button>
    </div>

    <div class="box">
      <h3>Delivery and offer</h3>
      <div class="two">
        <label>Delivery charge<input type="number" id="fDelivery" min="0" inputmode="decimal" placeholder="0"></label>
        <label>Discount
          <input type="number" id="fDisc" min="0" inputmode="decimal" placeholder="0">
        </label>
      </div>
      <div class="seg" id="discType">
        <button type="button" data-v="amt" class="on">Amount off</button>
        <button type="button" data-v="pct">% off</button>
      </div>
      <label>Offer name (optional)<input type="text" id="fOffer" placeholder="e.g. Avurudu sale, Buy 2 get 10% off"></label>
    </div>

    <div class="box">
      <h3>Payment</h3>
      <div class="seg" id="method">
        <button type="button" data-v="COD">Cash on delivery</button>
        <button type="button" data-v="Bank">Bank transfer</button>
        <button type="button" data-v="Handover">Handover</button>
      </div>
      <div class="seg" id="paid">
        <button type="button" data-v="0">Unpaid</button>
        <button type="button" data-v="1">Paid</button>
      </div>
    </div>

    <div class="box">
      <h3>Delivery status</h3>
      <div class="seg" id="status"></div>
      <label>Note (optional)<textarea id="fNote" placeholder="Gift wrap, call before delivery…"></textarea></label>
    </div>

    <div class="box">
      <h3>Summary</h3>
      <div class="sum" id="sum"></div>
    </div>
    <div class="err" id="err"></div>
  </form>
  <div class="savebar"><button class="btn" id="saveBtn">Save order</button></div>
</div>

<!-- Delete dialog -->
<div class="modal" id="delModal">
  <div class="dialog">
    <h3>Delete this order?</h3>
    <p class="muted" id="delText" style="margin:0"></p>
    <div class="actions" style="margin:0">
      <button class="btn ghost" id="delNo" style="flex:1">Keep it</button>
      <button class="btn danger" id="delYes" style="flex:1">Delete order</button>
    </div>
  </div>
</div>

<!-- Settings dialog -->
<div class="modal" id="setModal">
  <div class="dialog">
    <h3>Settings</h3>
    <label>Currency symbol<input type="text" id="curInput" maxlength="6" placeholder="Rs."></label>
    <div class="actions" style="margin:0">
      <button class="btn ghost" id="setNo" style="flex:1">Cancel</button>
      <button class="btn" id="setYes" style="flex:1">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SIZES = ['XS','S','M','L','XL','XXL','2Y','4Y','6Y','8Y','10Y','12Y'];
const STATUSES = [
  {v:'pending',  label:'Pending',          cls:'t-pending'},
  {v:'packed',   label:'Packed',           cls:'t-packed'},
  {v:'out',      label:'Out for delivery', cls:'t-out'},
  {v:'done',     label:'Delivered',        cls:'t-done'},
  {v:'cancel',   label:'Cancelled',        cls:'t-cancel'}
];
const METHOD_LABEL = {COD:'Cash on delivery', Bank:'Bank transfer', Handover:'Handover'};
const FILTERS = [
  {v:'all',label:'All'},{v:'pending',label:'Pending'},{v:'packed',label:'Packed'},
  {v:'out',label:'Out for delivery'},{v:'done',label:'Delivered'},
  {v:'unpaid',label:'Unpaid'},{v:'cancel',label:'Cancelled'}
];

let db = { orders: [], currency: 'Rs.' };
let filter = 'all';
let draft = null;       // order being edited
let editingId = null;
let deleteId = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isNaN(n) || n < 0 ? 0 : n; };
const money = n => db.currency + ' ' + (Math.round(n * 100) / 100).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:2});

/* ---------- CLOUD SETTINGS: edit these two lines ---------- */
const DB_URL = 'https://blinkblossom-default-rtdb.asia-southeast1.firebasedatabase.app';   // paste your Firebase Realtime Database URL here
const SHOP_CODE = 'bb-k7m2x9q4p8w3';  // your private shop code, same on every phone
const CLOUD = DB_URL.trim().length > 0;
const base = () => DB_URL.trim().replace(/\/$/,'') + '/shops/' + encodeURIComponent(SHOP_CODE);

function setSync(state){
  const el = $('sync'); if (!el) return;
  if (!CLOUD){ el.textContent = '· saved on this phone only'; el.style.color = 'var(--soft)'; return; }
  el.textContent = state === 'ok' ? '· ☁️ synced' : '· ⚠️ offline';
  el.style.color = state === 'ok' ? 'var(--mint-ink)' : 'var(--rose-ink)';
}
async function cloud(method, path, body){
  const r = await fetch(base() + path + '.json', {method, body: body === undefined ? undefined : JSON.stringify(body)});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* local copy (so the app opens fast and works offline for viewing) */
async function load(){
  try{ const v = localStorage.getItem('blink-blossom-data'); if (v) db = Object.assign(db, JSON.parse(v)); return; }catch(e){}
  try{ const r = await window.storage.get('blink-blossom-data'); if (r && r.value) db = Object.assign(db, JSON.parse(r.value)); }catch(e){}
}
async function save(){
  const v = JSON.stringify(db);
  try{ localStorage.setItem('blink-blossom-data', v); return; }catch(e){}
  try{ await window.storage.set('blink-blossom-data', v); }catch(e){}
}

/* cloud sync */
async function pull(){
  if (!CLOUD){ setSync(); return; }
  try{
    const d = await cloud('GET', '');
    db.orders = d && d.orders ? Object.values(d.orders) : [];
    if (d && d.currency) db.currency = d.currency;
    await save(); setSync('ok');
  }catch(e){ setSync('err'); }
}
async function pushOrder(o){
  if (!CLOUD) return;
  try{ await cloud('PUT', '/orders/' + o.id, o); setSync('ok'); }
  catch(e){ setSync('err'); toast('Could not sync. Check internet.'); }
}
async function removeOrder(id){
  if (!CLOUD) return;
  try{ await cloud('DELETE', '/orders/' + id); setSync('ok'); }
  catch(e){ setSync('err'); toast('Could not sync. Check internet.'); }
}
async function pushCurrency(){
  if (!CLOUD) return;
  try{ await cloud('PUT', '/currency', db.currency); setSync('ok'); }catch(e){ setSync('err'); }
}
async function refresh(){
  const busy = $('sheet').classList.contains('open') || document.querySelector('.modal.open');
  if (busy) return;
  await pull(); renderList();
}

/* ---------- maths ---------- */
function totals(o){
  const sub = o.items.reduce((s,i) => s + num(i.qty) * num(i.price), 0);
  const disc = Math.min(sub, o.discType === 'pct' ? sub * Math.min(num(o.discVal),100) / 100 : num(o.discVal));
  const total = sub - disc + num(o.delivery);
  return {sub, disc, total};
}

/* ---------- list ---------- */
function renderList(){
  const q = $('search').value.trim().toLowerCase();
  let rows = db.orders.slice().sort((a,b) => b.createdAt - a.createdAt);
  rows = rows.filter(o => {
    if (filter === 'unpaid' && (o.paid || o.status === 'cancel')) return false;
    if (!['all','unpaid'].includes(filter) && o.status !== filter) return false;
    if (q && !(`${o.name} ${o.phone} ${o.address}`.toLowerCase().includes(q))) return false;
    return true;
  });

  // stats
  $('stTodo').textContent = db.orders.filter(o => ['pending','packed','out'].includes(o.status)).length;
  $('stDone').textContent = db.orders.filter(o => o.status === 'done').length;
  $('stUnpaid').textContent = db.orders.filter(o => !o.paid && o.status !== 'cancel').length;

  // chips
  $('chips').innerHTML = FILTERS.map(f =>
    `<button class="chip ${filter===f.v?'on':''}" data-f="${f.v}">${f.label}</button>`).join('');

  if (!rows.length){
    $('list').innerHTML = `<div class="empty"><div class="big">🌸</div>
      <p><b>${db.orders.length ? 'No orders match' : 'No orders yet'}</b><br>
      ${db.orders.length ? 'Try another filter or search.' : 'Tap “New order” to add your first one.'}</p></div>`;
    return;
  }

  $('list').innerHTML = rows.map(o => {
    const t = totals(o);
    const st = STATUSES.find(s => s.v === o.status) || STATUSES[0];
    const date = new Date(o.createdAt).toLocaleDateString(undefined,{day:'numeric',month:'short'});
    return `<article class="order" data-id="${o.id}">
      <div class="row">
        <div><h3>${esc(o.name)}</h3><div class="muted">${esc(o.phone)} · ${date}</div></div>
        <div class="price">${money(t.total)}</div>
      </div>
      <div class="muted" style="margin-top:4px">${esc(o.address)}</div>
      <div class="tags">
        <span class="tag ${st.cls}">${st.label}</span>
        <span class="tag ${o.paid?'t-paid':'t-unpaid'}">${o.paid?'Paid':'Unpaid'}</span>
        <span class="tag t-method">${METHOD_LABEL[o.method]}</span>
        ${t.disc>0 ? `<span class="tag t-packed">${o.offer?esc(o.offer):'Discount'} −${money(t.disc)}</span>`:''}
      </div>
      <ul class="items">${o.items.map(i =>
        `<li><span>${i.gender==='Girls'?'👧':'👦'} ${esc(i.name||'Item')} · ${i.size} × ${num(i.qty)}</span><span>${money(num(i.qty)*num(i.price))}</span></li>`).join('')}</ul>
      ${o.note ? `<div class="muted" style="margin-top:8px">📝 ${esc(o.note)}</div>`:''}
      <div class="actions">
        <button class="btn sm" data-act="edit">Edit</button>
        <button class="btn sm ghost" data-act="next">${nextLabel(o)}</button>
        <button class="btn sm danger" data-act="del">Delete</button>
      </div>
    </article>`;
  }).join('');
}

function nextLabel(o){
  if (o.status === 'cancel') return 'Reopen';
  if (o.status === 'done') return o.paid ? 'Done ✓' : 'Mark paid';
  return {pending:'Mark packed', packed:'Out for delivery', out:'Mark delivered'}[o.status];
}
function advance(o){
  if (o.status === 'cancel') o.status = 'pending';
  else if (o.status === 'done'){ if (!o.paid) o.paid = true; else return false; }
  else {
    o.status = {pending:'packed', packed:'out', out:'done'}[o.status];
    if (o.status === 'done' && o.method === 'COD') o.paid = true;
  }
  return true;
}

/* ---------- form ---------- */
const blankItem = () => ({name:'', gender:'Girls', size:'M', qty:1, price:''});
const blankOrder = () => ({ name:'', phone:'', address:'', items:[blankItem()], delivery:'', discType:'amt', discVal:'',
  offer:'', method:'COD', paid:false, status:'pending', note:'' });

function openForm(order){
  editingId = order ? order.id : null;
  draft = order ? JSON.parse(JSON.stringify(order)) : blankOrder();
  $('formTitle').textContent = order ? 'Edit order' : 'New order';
  $('fName').value = draft.name; $('fPhone').value = draft.phone; $('fAddress').value = draft.address;
  $('fDelivery').value = draft.delivery; $('fDisc').value = draft.discVal;
  $('fOffer').value = draft.offer; $('fNote').value = draft.note;
  $('err').style.display = 'none';
  renderItems(); syncSegs(); updateSummary();
  $('sheet').classList.add('open'); $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeForm(){
  $('sheet').classList.remove('open'); document.body.style.overflow = '';
}

function syncSegs(){
  const mark = (id, val) => document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === String(val)));
  mark('discType', draft.discType); mark('method', draft.method);
  mark('paid', draft.paid ? 1 : 0); mark('status', draft.status);
}

function renderItems(){
  $('itemsBox').innerHTML = draft.items.map((it, i) => `
    <div class="item" data-i="${i}">
      <div class="top"><b>Item ${i+1}</b>
        ${draft.items.length>1 ? `<button type="button" class="rm" data-rm="${i}">Remove</button>`:''}</div>
      <label>Item name<input type="text" data-k="name" value="${esc(it.name)}" placeholder="e.g. Frock, T-shirt, Shorts"></label>
      <div class="seg g">
        <button type="button" data-gender="Girls" class="girl ${it.gender==='Girls'?'on':''}">👧 Girls</button>
        <button type="button" data-gender="Boys" class="boy ${it.gender==='Boys'?'on':''}">👦 Boys</button>
      </div>
      <div class="sizes">${SIZES.map(s => `<button type="button" data-size="${s}" class="${it.size===s?'on':''}">${s}</button>`).join('')}</div>
      <div class="two">
        <label>Quantity<input type="number" data-k="qty" min="1" inputmode="numeric" value="${it.qty}"></label>
        <label>Price (each)<input type="number" data-k="price" min="0" inputmode="decimal" value="${it.price}" placeholder="0"></label>
      </div>
    </div>`).join('');
}

function updateSummary(){
  const t = totals(draft);
  const cur = db.currency;
  $('sum').innerHTML = `
    <div><span>Items total</span><b>${money(t.sub)}</b></div>
    <div><span>Discount${draft.offer?` (${esc(draft.offer)})`:''}</span><b>− ${money(t.disc)}</b></div>
    <div><span>Delivery</span><b>${money(num(draft.delivery))}</b></div>
    <div class="total"><span>Total</span><span>${money(t.total)}</span></div>`;
}

function validate(){
  if (!draft.name.trim()) return 'Please enter the customer name.';
  if (!draft.address.trim()) return 'Please enter the delivery address.';
  const bad = draft.items.findIndex(i => !i.name.trim() || num(i.qty) < 1 || num(i.price) <= 0);
  if (bad >= 0) return `Item ${bad+1} needs a name, quantity and price.`;
  return '';
}

async function saveOrder(){
  const msg = validate();
  if (msg){ const e = $('err'); e.textContent = msg; e.style.display = 'block'; e.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  draft.items.forEach(i => { i.qty = num(i.qty); i.price = num(i.price); });
  draft.delivery = num(draft.delivery); draft.discVal = num(draft.discVal);
  let saved;
  if (editingId){
    const idx = db.orders.findIndex(o => o.id === editingId);
    saved = db.orders[idx] = Object.assign({}, db.orders[idx], draft);
  } else {
    draft.id = 'o' + Date.now(); draft.createdAt = Date.now();
    db.orders.push(draft); saved = draft;
  }
  await save(); closeForm(); renderList();
  await pushOrder(saved);
  toast(editingId ? 'Order updated' : 'Order saved');
}

/* ---------- events ---------- */
$('fab').onclick = () => openForm(null);
$('closeForm').onclick = closeForm;
$('saveBtn').onclick = saveOrder;
$('form').addEventListener('submit', e => e.preventDefault());
$('search').addEventListener('input', renderList);

$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f; renderList();
});

$('list').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const card = btn.closest('.order');
  const o = db.orders.find(x => x.id === card.dataset.id); if (!o) return;
  if (btn.dataset.act === 'edit') openForm(o);
  if (btn.dataset.act === 'del'){
    deleteId = o.id;
    $('delText').textContent = `${o.name}'s order of ${money(totals(o).total)} will be removed for good.`;
    $('delModal').classList.add('open');
  }
  if (btn.dataset.act === 'next'){
    if (advance(o)){ await save(); renderList(); toast('Order updated'); await pushOrder(o); }
  }
});

// form text fields
const bindText = (id, key) => $(id).addEventListener('input', e => { draft[key] = e.target.value; updateSummary(); });
bindText('fName','name'); bindText('fPhone','phone'); bindText('fAddress','address');
bindText('fDelivery','delivery'); bindText('fDisc','discVal'); bindText('fOffer','offer'); bindText('fNote','note');

// item events
$('itemsBox').addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k) return;
  const i = +e.target.closest('.item').dataset.i;
  draft.items[i][k] = e.target.value; updateSummary();
});
$('itemsBox').addEventListener('click', e => {
  const item = e.target.closest('.item'); if (!item) return;
  const i = +item.dataset.i;
  const g = e.target.closest('[data-gender]'), s = e.target.closest('[data-size]'), r = e.target.closest('[data-rm]');
  if (g){ draft.items[i].gender = g.dataset.gender; }
  else if (s){ draft.items[i].size = s.dataset.size; }
  else if (r){ draft.items.splice(i,1); }
  else return;
  renderItems(); updateSummary();
});
$('addItem').onclick = () => {
  draft.items.push(blankItem()); renderItems(); updateSummary();
  const last = $('itemsBox').lastElementChild; last && last.scrollIntoView({behavior:'smooth',block:'center'});
};

// segmented buttons
function seg(id, key, conv){
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    draft[key] = conv ? conv(b.dataset.v) : b.dataset.v;
    syncSegs(); updateSummary();
  });
}
seg('discType','discType'); seg('method','method'); seg('paid','paid', v => v === '1'); seg('status','status');
$('status').innerHTML = STATUSES.map(s => `<button type="button" data-v="${s.v}">${s.label}</button>`).join('');

// delete dialog
$('delNo').onclick = () => $('delModal').classList.remove('open');
$('delYes').onclick = async () => {
  const gone = deleteId;
  db.orders = db.orders.filter(o => o.id !== gone);
  $('delModal').classList.remove('open');
  await save(); renderList(); toast('Order deleted');
  await removeOrder(gone);
};

// settings
$('gearBtn').onclick = () => { $('curInput').value = db.currency; $('setModal').classList.add('open'); };
$('setNo').onclick = () => $('setModal').classList.remove('open');
$('setYes').onclick = async () => {
  db.currency = $('curInput').value.trim() || 'Rs.';
  $('setModal').classList.remove('open'); await save(); renderList(); toast('Saved'); await pushCurrency();
};

function toast(t){
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800);
}

(async () => {
  await load(); renderList(); setSync();
  await pull(); renderList();
  setInterval(refresh, 8000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
